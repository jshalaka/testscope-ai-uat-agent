name: TestScope CI

on:
  push:
    branches:
      - main
      - feature/playwright-automation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: PyTest and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start TestScope application
        run: |
          python -m streamlit run app.py \
            --server.headless true \
            --server.port 8501 \
            > streamlit.log 2>&1 &

          for attempt in {1..30}; do
            if curl --fail http://localhost:8501/_stcore/health; then
              exit 0
            fi
            sleep 2
          done

          cat streamlit.log
          exit 1

      - name: Run complete regression suite
        run: python -m pytest -q

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: |
            reports/playwright/
            streamlit.log
          if-no-files-found: ignore
          retention-days: 7